<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>*{box-sizing:border-box}body{margin:0;width:700px;height:360px;padding:20px;background:var(--color-baby);font-family:var(--font-text);display:flex;flex-direction:column;gap:14px}</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.MISTDesignSystem_78a22e;
function Demo(){
  const [checked, setChecked] = React.useState(true);
  const [net, setNet] = React.useState('main');
  const [on, setOn] = React.useState(false);
  return (
    <React.Fragment>
      <div style={{display:'flex',gap:14}}>
        <Input label="Operator ID" placeholder="acme-01" helpText="Matches your registry key" />
        <Select label="Network" options={[{label:'Mainnet',value:'main'},{label:'Testnet',value:'test'}]} value={net} onChange={e=>setNet(e.target.value)} />
      </div>
      <Input label="Endpoint" value="" error="Required" />
      <div style={{display:'flex',gap:20,alignItems:'center'}}>
        <Checkbox label="Reviewed" checked={checked} onChange={e=>setChecked(e.target.checked)} />
        <Radio name="net2" label="Mainnet" checked={net==='main'} onChange={()=>setNet('main')} />
        <Radio name="net2" label="Testnet" checked={net==='test'} onChange={()=>setNet('test')} />
        <Switch label="Publish on-chain" checked={on} onChange={e=>setOn(e.target.checked)} />
      </div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
